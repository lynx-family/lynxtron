name: install common dependencies

description: pull common source and binary dependencies via habitat.

inputs:
  concurrency:
    description: concurrency of requests
    default: '2'
    required: false
  cache-scope:
    description: Isolated Habitat HTTP cache scope for this dependency graph
    default: ''
    required: false
  target:
    description: habitat target
    default: ''
    required: false
  target_only:
    description: only install dependencies for the target
    default: 'false'
    required: false
  run-habitat-sync:
    description: whether to run habitat sync
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    # Cache only immutable HTTP archives. Git mirrors are intentionally kept out
    # of the action cache: they are mutable, much larger, and protected by the
    # per-repository fetch transaction in habitat_lock.py.
    #
    # Keep narrow graphs (for example tools_shared in static-check) separate
    # from full builds. A cache entry is immutable after an exact hit, so sharing
    # one key allowed a narrow job to permanently seed an incomplete cache.
    - name: Restore Habitat HTTP objects
      if: ${{ inputs.cache-scope != '' }}
      uses: lynx-infra/cache@5c6160a6a4c7fca80a2f3057bb9dfc9513fcb732
      with:
        path: |
          lynxtron/.habitat_cache/objects
          !lynxtron/.habitat_cache/objects/cef-builds.spotifycdn.com/**
        key: hab-objects-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('lynxtron/.habitat', 'lynxtron/src/dependencies/DEPS', 'lynxtron/src/**/.habitat', 'lynxtron/lynxtron_tools/hab') }}
        restore-keys: |
          hab-objects-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-

    - name: run habitat sync
      if: ${{ inputs.run-habitat-sync == 'true' }}
      shell: bash
      working-directory: lynxtron/src
      run: |
        set -x
        if [[ "${{ inputs.target }}" == "" ]]; then
          python3 ${{ github.workspace }}/lynxtron/lynxtron_tools/habitat_lock.py -- ${{ github.workspace }}/lynxtron/lynxtron_tools/hab sync . --cache-dir "$HABITAT_CACHE_DIR"
        elif [[ "${{ inputs.target_only }}" == "true" ]]; then
          python3 ${{ github.workspace }}/lynxtron/lynxtron_tools/habitat_lock.py -- ${{ github.workspace }}/lynxtron/lynxtron_tools/hab sync . --cache-dir "$HABITAT_CACHE_DIR" --target ${{ inputs.target }} --target-only
        else
          python3 ${{ github.workspace }}/lynxtron/lynxtron_tools/habitat_lock.py -- ${{ github.workspace }}/lynxtron/lynxtron_tools/hab sync . --cache-dir "$HABITAT_CACHE_DIR" --target ${{ inputs.target }}
        fi
      env:
        HABITAT_CONCURRENCY: ${{ inputs.concurrency }}
        HABITAT_CACHE_DIR: ${{ github.workspace }}/lynxtron/.habitat_cache
        GIT_LFS_SKIP_SMUDGE: 1
