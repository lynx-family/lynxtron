name: publish

on:
  workflow_call:
    inputs:
      source_ref:
        description: 'branch, tag, or commit to publish'
        required: true
        type: string
      tag:
        description: 'release tag'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'branch, tag, or commit to publish (e.g. feature/my-change)'
        required: true
        default: main
        type: string
      tag:
        description: 'release tag (e.g. v1.2.3-alpha.0). Release and DevTool runtimes are published together.'
        required: true
        type: string

defaults:
  run:
    working-directory: lynxtron

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    defaults:
      run:
        working-directory: ./
    env:
      INPUT_TAG: ${{ inputs.tag }}
      TRIGGER_EVENT: ${{ github.event_name }}
    outputs:
      source_sha: ${{ steps.set-version.outputs.source_sha }}
      version: ${{ steps.set-version.outputs.version }}
      tag: ${{ steps.set-version.outputs.tag }}
      prerelease: ${{ steps.set-version.outputs.prerelease }}
    steps:
      - name: Resolve source revision
        uses: actions/checkout@v4.2.2
        with:
          path: source
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Validate and set version
        id: set-version
        run: |
          set -eu
          if [ -z "$INPUT_TAG" ]; then
            echo "tag input is required."
            exit 1
          fi
          tag="v${INPUT_TAG#v}"
          version="${tag#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "tag must contain a valid semantic version; got '$INPUT_TAG'"
            exit 1
          fi
          case "$version" in
            *-dev|*-dev.*)
              echo "tag must not include a '-dev' pre-release label; use a regular version because Release and DevTool runtimes are published together"
              exit 1
              ;;
          esac
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            case "$version" in
              *-alpha|*-alpha.*) ;;
              *)
                echo "manually dispatched branch releases must use an alpha version (e.g. v1.2.3-alpha.0)"
                exit 1
                ;;
            esac
          elif [ "$prerelease" = "true" ]; then
            echo "Changesets releases from main must use a stable version; got '$version'"
            exit 1
          fi
          source_sha=$(git -C source rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-darwin-15.6.1-medium
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build macOS Lynxtron
        uses: ./lynxtron/.github/actions/macos-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'false'
      - name: Package macOS binary
        run: |
          set -x
          cd ${{ github.workspace }}/lynxtron
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p publish
          cd out/Release
          # Find the main app bundle and package it
          if [ -d "Lynxtron.app" ]; then
            APP_NAME="Lynxtron.app"
          elif [ -d "lynxtron.app" ]; then
            APP_NAME="lynxtron.app"
          else
            echo "No app bundle found in out/Release"
            ls -la
            exit 1
          fi
          # Clean up .DS_Store, empty directories, and broken symlinks in app bundle
          find "$APP_NAME" -name ".DS_Store" -type f -delete
          find "$APP_NAME" -type d -empty -delete
          find "$APP_NAME" -type l ! -exec test -e {} \; -delete
          # Create a temporary directory with clean layout for the zip
          mkdir -p dist
          cp -R "$APP_NAME" dist/
          cd dist
          zip -ry "$OLDPWD/../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}.zip" "$APP_NAME"
          ls -lh "$OLDPWD/../../publish/"

          # Package symbols (dSYM files only)
          cd "$OLDPWD"
          SYMBOLS_DIR="v${VERSION}-darwin-${{ matrix.arch }}-symbols"
          mkdir -p "$SYMBOLS_DIR"
          find . -path "./v${VERSION}-*" -prune -o -name "*.dSYM" -exec cp -r {} "$SYMBOLS_DIR/" \;
          zip -r -y "../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}-symbols.zip" "$SYMBOLS_DIR"
          ls -lh "../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}-symbols.zip"

          # Node headers are architecture-independent. Package them once to avoid
          # duplicate artifact names across the macOS matrix.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            rm -rf node_headers
            cd ${{ github.workspace }}/lynxtron
            python3 lynxtron_tools/copy_node_headers.py
            cd out/Release
            zip -r "../../publish/lynxtron-v${VERSION}-node-headers.zip" node_headers
            ls -lh "../../publish/lynxtron-v${VERSION}-node-headers.zip"
          fi
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-darwin-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}.zip
      - name: Upload macOS symbols
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-darwin-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}-symbols.zip
      - name: Upload node headers
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-node-headers
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-node-headers.zip

  build-linux:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-ubuntu-22.04-medium
    strategy:
      matrix:
        arch: [x64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build Linux Lynxtron
        uses: ./lynxtron/.github/actions/linux-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'false'
          gn-args: symbol_level=1
      - name: Package Linux binary
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/lynxtron"
          source lynxtron_tools/envsetup.sh
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p publish

          SYMBOLS_DIR="out/Release/lynxtron-symbols"
          rm -rf "$SYMBOLS_DIR"
          mkdir -p "$SYMBOLS_DIR"
          LLVM_TOOLS_DIR="${{ github.workspace }}/lynxtron/third_party/llvm-build/Release+Asserts/bin"
          extract_linux_symbols() {
            local binary_path="$1"
            local symbol_name="$2"

            if [ ! -f "$binary_path" ]; then
              return
            fi

            local symbol_path="$SYMBOLS_DIR/${symbol_name}.debug"
            local stripped_path="${binary_path}.stripped"
            python3 build/linux/strip_binary.py \
              --llvm-strip-binary-path "$LLVM_TOOLS_DIR/llvm-strip" \
              --llvm-objcopy-binary-path "$LLVM_TOOLS_DIR/llvm-objcopy" \
              --binary-input "$binary_path" \
              --symbol-output "$symbol_path" \
              --stripped-binary-output "$stripped_path"
            mv "$stripped_path" "$binary_path"
          }

          extract_linux_symbols out/Release/lynxtron lynxtron
          extract_linux_symbols out/Release/liblynxtron.so liblynxtron.so
          find "$SYMBOLS_DIR" -type f -ls
          SYMBOLS_SIZE=$(find "$SYMBOLS_DIR" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          if [ "$SYMBOLS_SIZE" -le 1024 ]; then
            echo "Linux symbols package is empty or unexpectedly small: ${SYMBOLS_SIZE} bytes"
            exit 1
          fi

          ninja -C out/Release lynxtron_dist_zip
          mv out/Release/dist.zip "publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}.zip"
          ls -lh "publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}.zip"

          cd out/Release
          python3 "${{ github.workspace }}/lynxtron/src/tools/compress_helper.py" lynxtron-symbols
          mv lynxtron-symbols.zip "../../publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-symbols.zip"
          ls -lh "../../publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-symbols.zip"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-linux-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}.zip
      - name: Upload Linux symbols
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-linux-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}-symbols.zip

  build-windows:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-windows-2022-large
    strategy:
      matrix:
        arch: [x64]
    steps:
      - name: Configure Git
        shell: PowerShell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global http.sslBackend "schannel"
        working-directory: ./
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build Windows Lynxtron
        uses: ./lynxtron/.github/actions/windows-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'false'
      - name: Package Windows binary
        shell: PowerShell
        run: |
          $VERSION = "${{ needs.get-version.outputs.version }}"
          $workspace = "${{ github.workspace }}\lynxtron"
          $outDir = "$workspace\out"
          $releaseDir = "$outDir\Release"
          New-Item -ItemType Directory -Force -Path "$workspace\publish" | Out-Null

          # Create lynxtron_archive directory for packaging
          $archiveDir = "$outDir\lynxtron_archive"
          if (Test-Path $archiveDir) { Remove-Item -Recurse -Force $archiveDir }
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null

          # Copy all required files to archive directory
          Copy-Item -Path "$releaseDir\*.exe" -Destination $archiveDir -Force
          Copy-Item -Path "$releaseDir\*.dll" -Destination $archiveDir -Force
          Copy-Item -Path "$releaseDir\*.lib" -Destination $archiveDir -Force
          if (Test-Path "$releaseDir\lynx_core.js") { Copy-Item -Path "$releaseDir\lynx_core.js" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\lynx_core_dev.js") { Copy-Item -Path "$releaseDir\lynx_core_dev.js" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\devtool_resources") { Copy-Item -Recurse -Path "$releaseDir\devtool_resources" -Destination "$archiveDir\devtool_resources" -Force }
          if (Test-Path "$releaseDir\resources") { Copy-Item -Recurse -Path "$releaseDir\resources" -Destination "$archiveDir\resources" -Force }
          if (Test-Path "$releaseDir\icudtl.dat") { Copy-Item -Path "$releaseDir\icudtl.dat" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\snapshot_blob.bin") { Copy-Item -Path "$releaseDir\snapshot_blob.bin" -Destination $archiveDir -Force }

          # Remove unnecessary executable files
          $unwantedExes = @("mksnapshot.exe", "protoc.exe", "torque.exe", "cppgen_plugin.exe", "protozero_plugin.exe", "nasm.exe", "gen-regexp-special-case.exe", "node_js2c.exe", "bytecode_builtins_list_generator.exe")
          foreach ($exe in $unwantedExes) {
            $path = Join-Path $archiveDir $exe
            if (Test-Path $path) { Remove-Item -Force $path }
          }

          # Create version file
          Set-Content -Path "$archiveDir\version" -Value $VERSION

          # Clean up empty directories
          Get-ChildItem -Path $archiveDir -Recurse -Directory | Sort-Object FullName -Descending | ForEach-Object {
            if ((Get-ChildItem $_.FullName -Force).Count -eq 0) { Remove-Item $_.FullName -Force }
          }

          # Compress using compress_helper.py
          Set-Location $outDir
          python "$workspace\src\tools\compress_helper.py" lynxtron_archive
          Rename-Item -Path "$outDir\lynxtron_archive.zip" -NewName "lynxtron-v${VERSION}-win32-${{ matrix.arch }}.zip"
          Move-Item -Path "$outDir\lynxtron-v${VERSION}-win32-${{ matrix.arch }}.zip" -Destination "$workspace\publish\" -Force

          $zipPath = "$workspace\publish\lynxtron-v${VERSION}-win32-${{ matrix.arch }}.zip"
          Write-Host "Created $zipPath"
          Get-Item $zipPath | Select-Object Name, Length

          # Package symbols (pdb files only)
          $symbolsDir = "$outDir\lynxtron-symbols"
          if (Test-Path $symbolsDir) { Remove-Item -Recurse -Force $symbolsDir }
          New-Item -ItemType Directory -Force -Path $symbolsDir | Out-Null
          Get-ChildItem -Path $releaseDir -Filter "*.pdb" -Recurse | Copy-Item -Destination $symbolsDir -Force
          Set-Location $outDir
          python "$workspace\src\tools\compress_helper.py" lynxtron-symbols
          Rename-Item -Path "$outDir\lynxtron-symbols.zip" -NewName "lynxtron-v${VERSION}-win32-${{ matrix.arch }}-symbols.zip"
          Move-Item -Path "$outDir\lynxtron-v${VERSION}-win32-${{ matrix.arch }}-symbols.zip" -Destination "$workspace\publish\" -Force
          Write-Host "Created symbols package"
          Get-Item "$workspace\publish\lynxtron-v${VERSION}-win32-${{ matrix.arch }}-symbols.zip" | Select-Object Name, Length
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-win32-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-win32-${{ matrix.arch }}.zip
      - name: Upload Windows symbols
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-win32-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-win32-${{ matrix.arch }}-symbols.zip

  build-macos-devtool:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-darwin-15.6.1-medium
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build macOS Lynxtron (DevTool)
        uses: ./lynxtron/.github/actions/macos-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'true'
      - name: Package macOS binary (DevTool)
        run: |
          set -x
          cd ${{ github.workspace }}/lynxtron
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p publish
          cd out/Release
          if [ -d "Lynxtron.app" ]; then
            APP_NAME="Lynxtron.app"
          elif [ -d "lynxtron.app" ]; then
            APP_NAME="lynxtron.app"
          else
            echo "No app bundle found in out/Release"
            ls -la
            exit 1
          fi
          find "$APP_NAME" -name ".DS_Store" -type f -delete
          find "$APP_NAME" -type d -empty -delete
          find "$APP_NAME" -type l ! -exec test -e {} \; -delete
          mkdir -p dist
          cp -R "$APP_NAME" dist/
          cd dist
          zip -ry "$OLDPWD/../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}-devtool.zip" "$APP_NAME"
          ls -lh "$OLDPWD/../../publish/"

          cd "$OLDPWD"
          SYMBOLS_DIR="v${VERSION}-darwin-${{ matrix.arch }}-devtool-symbols"
          mkdir -p "$SYMBOLS_DIR"
          find . -path "./v${VERSION}-*" -prune -o -name "*.dSYM" -exec cp -r {} "$SYMBOLS_DIR/" \;
          zip -r -y "../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}-devtool-symbols.zip" "$SYMBOLS_DIR"
          ls -lh "../../publish/lynxtron-v${VERSION}-darwin-${{ matrix.arch }}-devtool-symbols.zip"
      - name: Upload macOS artifact (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-darwin-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}-devtool.zip
      - name: Upload macOS symbols (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-darwin-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}-devtool-symbols.zip

  build-linux-devtool:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-ubuntu-22.04-medium
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build Linux Lynxtron (DevTool)
        uses: ./lynxtron/.github/actions/linux-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'true'
          gn-args: symbol_level=1
      - name: Package Linux binary (DevTool)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/lynxtron"
          source lynxtron_tools/envsetup.sh
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p publish

          SYMBOLS_DIR="out/Release/lynxtron-symbols"
          rm -rf "$SYMBOLS_DIR"
          mkdir -p "$SYMBOLS_DIR"
          LLVM_TOOLS_DIR="${{ github.workspace }}/lynxtron/third_party/llvm-build/Release+Asserts/bin"
          extract_linux_symbols() {
            local binary_path="$1"
            local symbol_name="$2"

            if [ ! -f "$binary_path" ]; then
              return
            fi

            local symbol_path="$SYMBOLS_DIR/${symbol_name}.debug"
            local stripped_path="${binary_path}.stripped"
            python3 build/linux/strip_binary.py \
              --llvm-strip-binary-path "$LLVM_TOOLS_DIR/llvm-strip" \
              --llvm-objcopy-binary-path "$LLVM_TOOLS_DIR/llvm-objcopy" \
              --binary-input "$binary_path" \
              --symbol-output "$symbol_path" \
              --stripped-binary-output "$stripped_path"
            mv "$stripped_path" "$binary_path"
          }

          extract_linux_symbols out/Release/lynxtron lynxtron
          extract_linux_symbols out/Release/liblynxtron.so liblynxtron.so
          find "$SYMBOLS_DIR" -type f -ls
          SYMBOLS_SIZE=$(find "$SYMBOLS_DIR" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          if [ "$SYMBOLS_SIZE" -le 1024 ]; then
            echo "Linux symbols package is empty or unexpectedly small: ${SYMBOLS_SIZE} bytes"
            exit 1
          fi

          ninja -C out/Release lynxtron_dist_zip
          mv out/Release/dist.zip "publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-devtool.zip"
          ls -lh "publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-devtool.zip"

          cd out/Release
          python3 "${{ github.workspace }}/lynxtron/src/tools/compress_helper.py" lynxtron-symbols
          mv lynxtron-symbols.zip "../../publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-devtool-symbols.zip"
          ls -lh "../../publish/lynxtron-v${VERSION}-linux-${{ matrix.arch }}-devtool-symbols.zip"
      - name: Upload Linux artifact (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-linux-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}-devtool.zip
      - name: Upload Linux symbols (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-linux-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}-devtool-symbols.zip

  build-windows-devtool:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-windows-2022-large
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - name: Configure Git
        shell: PowerShell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global http.sslBackend "schannel"
        working-directory: ./
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build Windows Lynxtron (DevTool)
        uses: ./lynxtron/.github/actions/windows-lynxtron-build
        with:
          build-arch: ${{ matrix.arch }}
          enable-inspector: 'true'
      - name: Package Windows binary (DevTool)
        shell: PowerShell
        run: |
          $VERSION = "${{ needs.get-version.outputs.version }}"
          $workspace = "${{ github.workspace }}\lynxtron"
          $outDir = "$workspace\out"
          $releaseDir = "$outDir\Release"
          New-Item -ItemType Directory -Force -Path "$workspace\publish" | Out-Null

          $archiveDir = "$outDir\lynxtron_archive"
          if (Test-Path $archiveDir) { Remove-Item -Recurse -Force $archiveDir }
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null

          Copy-Item -Path "$releaseDir\*.exe" -Destination $archiveDir -Force
          Copy-Item -Path "$releaseDir\*.dll" -Destination $archiveDir -Force
          Copy-Item -Path "$releaseDir\*.lib" -Destination $archiveDir -Force
          if (Test-Path "$releaseDir\lynx_core.js") { Copy-Item -Path "$releaseDir\lynx_core.js" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\lynx_core_dev.js") { Copy-Item -Path "$releaseDir\lynx_core_dev.js" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\devtool_resources") { Copy-Item -Recurse -Path "$releaseDir\devtool_resources" -Destination "$archiveDir\devtool_resources" -Force }
          if (Test-Path "$releaseDir\resources") { Copy-Item -Recurse -Path "$releaseDir\resources" -Destination "$archiveDir\resources" -Force }
          if (Test-Path "$releaseDir\icudtl.dat") { Copy-Item -Path "$releaseDir\icudtl.dat" -Destination $archiveDir -Force }
          if (Test-Path "$releaseDir\snapshot_blob.bin") { Copy-Item -Path "$releaseDir\snapshot_blob.bin" -Destination $archiveDir -Force }

          $unwantedExes = @("mksnapshot.exe", "protoc.exe", "torque.exe", "cppgen_plugin.exe", "protozero_plugin.exe", "nasm.exe", "gen-regexp-special-case.exe", "node_js2c.exe", "bytecode_builtins_list_generator.exe")
          foreach ($exe in $unwantedExes) {
            $path = Join-Path $archiveDir $exe
            if (Test-Path $path) { Remove-Item -Force $path }
          }

          Set-Content -Path "$archiveDir\version" -Value $VERSION

          Get-ChildItem -Path $archiveDir -Recurse -Directory | Sort-Object FullName -Descending | ForEach-Object {
            if ((Get-ChildItem $_.FullName -Force).Count -eq 0) { Remove-Item $_.FullName -Force }
          }

          Set-Location $outDir
          python "$workspace\src\tools\compress_helper.py" lynxtron_archive
          Rename-Item -Path "$outDir\lynxtron_archive.zip" -NewName "lynxtron-v${VERSION}-win32-${{ matrix.arch }}-devtool.zip"
          Move-Item -Path "$outDir\lynxtron-v${VERSION}-win32-${{ matrix.arch }}-devtool.zip" -Destination "$workspace\publish\" -Force

          $symbolsDir = "$outDir\lynxtron-symbols"
          if (Test-Path $symbolsDir) { Remove-Item -Recurse -Force $symbolsDir }
          New-Item -ItemType Directory -Force -Path $symbolsDir | Out-Null
          Get-ChildItem -Path $releaseDir -Filter "*.pdb" -Recurse | Copy-Item -Destination $symbolsDir -Force
          Set-Location $outDir
          python "$workspace\src\tools\compress_helper.py" lynxtron-symbols
          Rename-Item -Path "$outDir\lynxtron-symbols.zip" -NewName "lynxtron-v${VERSION}-win32-${{ matrix.arch }}-devtool-symbols.zip"
          Move-Item -Path "$outDir\lynxtron-v${VERSION}-win32-${{ matrix.arch }}-devtool-symbols.zip" -Destination "$workspace\publish\" -Force
      - name: Upload Windows artifact (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-win32-${{ matrix.arch }}
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-win32-${{ matrix.arch }}-devtool.zip
      - name: Upload Windows symbols (DevTool)
        uses: actions/upload-artifact@v4
        with:
          name: devtool-lynxtron-win32-${{ matrix.arch }}-symbols
          path: lynxtron/publish/lynxtron-v${{ needs.get-version.outputs.version }}-win32-${{ matrix.arch }}-devtool-symbols.zip

  build-cef-webview-macos:
    needs: get-version
    timeout-minutes: 120
    runs-on: lynx-darwin-15.6.1-medium
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Install Common Dependencies
        uses: ./lynxtron/.github/actions/common-deps
        with:
          run-habitat-sync: 'false'
      - name: Prepare environment
        shell: bash
        env:
          HABITAT_CONCURRENCY: 2
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}/lynxtron
          git config --global http.version HTTP/1.1
          git config --global user.name "Lynxtron Scripts"
          git config --global user.email "scripts@lynxtron.com"
          source lynxtron_tools/envsetup.sh
          python3 lynxtron_tools/prepare_build_env.py
          cd ${{ github.workspace }}/lynxtron/lynx/third_party/weak-node-api/
          python3 setup_deps.py
          # Sync CEF binary distribution required by cef-webview CMakeLists.
          cd ${{ github.workspace }}/lynxtron/src
          for attempt in 1 2 3; do
            if "${{ github.workspace }}/lynxtron/lynxtron_tools/hab" sync . -f --no-history --target extension --target-only; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sync CEF extension dependencies failed after 3 attempts"
              exit 1
            fi
            delay=$((10 * (2 ** (attempt - 1))))
            echo "sync CEF extension dependencies failed (attempt $attempt/3); retrying in $delay seconds..."
            sleep "$delay"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install CMake
        shell: bash
        run: |
          brew install cmake
          cmake --version
      - name: Build CEF webview
        shell: bash
        run: |
          set -e
          set -x
          VERSION=${{ needs.get-version.outputs.version }}
          PLATFORM="darwin"
          ARCH="${{ matrix.arch }}"
          PACKAGE_DIR=${{ github.workspace }}/lynxtron/src/packages/cef-webview
          cd "$PACKAGE_DIR"
          # Install only the build deps. The package's @lynx-js/lynxtron
          # devDependency is not required for macOS native builds and is
          # skipped to avoid resolving an unreleased version on the registry.
          npm install --no-save --ignore-scripts \
            cmake-js@^7.4.0 \
            node-addon-api@^7.0.0
          if [ "$ARCH" = "arm64" ]; then
            export CMAKE_OSX_ARCHITECTURES=arm64
            npx cmake-js build
          else
            export CMAKE_OSX_ARCHITECTURES=x86_64
            arch -x86_64 npx cmake-js build
          fi
          ROOT_NAME="cef_webview-v${VERSION}-${PLATFORM}-${ARCH}"
          TMP_DIR="$PACKAGE_DIR/_pack_tmp_${ARCH}"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR/$ROOT_NAME"
          cp ./build/Release/cef_extension.node "$TMP_DIR/$ROOT_NAME/"
          mkdir -p "$TMP_DIR/$ROOT_NAME/frameworks"
          cp -R ./build/frameworks/Contents/Frameworks/* "$TMP_DIR/$ROOT_NAME/frameworks/"
          mkdir -p ${{ github.workspace }}/lynxtron/publish
          cd "$TMP_DIR"
          zip -ry "${{ github.workspace }}/lynxtron/publish/${ROOT_NAME}.zip" "$ROOT_NAME"
          ls -lh "${{ github.workspace }}/lynxtron/publish/${ROOT_NAME}.zip"
      - name: Upload CEF webview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cef-webview-darwin-${{ matrix.arch }}
          path: lynxtron/publish/cef_webview-v${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}.zip

  create-release:
    needs:
      [
        get-version,
        build-cef-webview-macos,
        build-macos,
        build-linux,
        build-windows,
        build-macos-devtool,
        build-linux-devtool,
        build-windows-devtool,
      ]
    runs-on: lynx-ubuntu-22.04-medium
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{lynxtron-*,devtool-lynxtron-*,cef-webview-*}'
      - name: List artifacts
        run: ls -lhR artifacts/
      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.get-version.outputs.tag }}
          commit: ${{ needs.get-version.outputs.source_sha }}
          name: Release ${{ needs.get-version.outputs.tag }}
          prerelease: ${{ needs.get-version.outputs.prerelease == 'true' }}
          generateReleaseNotes: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: 'artifacts/**/*.zip'

  publish-npm:
    needs: [get-version, create-release]
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: lynxtron/src/packages/lynxtron
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynxtron
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          registry-url: 'https://registry.npmjs.org'
          provenance: false
      - name: Sync version from tag
        id: prepare
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          cd ${{ github.workspace }}/lynxtron
          # lynx-library-headers' prepack runs copy-headers.cjs which requires
          # the synced lynx source tree (LYNX_SOURCE_ROOT). Reuse the same
          # bootstrap as build jobs to sync lynx + tools and run yarn install.
          git config --global user.name "Lynxtron Scripts"
          git config --global user.email "scripts@lynxtron.com"
          source lynxtron_tools/envsetup.sh
          python3 lynxtron_tools/prepare_build_env.py
          cd ${{ github.workspace }}/lynxtron/lynx/third_party/weak-node-api/
          python3 setup_deps.py
          # Determine npm dist-tag from the version's pre-release label.
          # e.g. 1.2.3-alpha.0 -> alpha, 1.2.3-beta.1 -> beta, 1.2.3 -> latest.
          PRERELEASE=$(echo "$VERSION" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-zA-Z]+).*/\1/p')
          if [ -n "$PRERELEASE" ]; then
            NPM_TAG="$PRERELEASE"
          else
            NPM_TAG="latest"
          fi
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Using npm dist-tag: $NPM_TAG"
          # Update package.json version field
          cd ${{ github.workspace }}/lynxtron/src/packages
          python3 publish_prepare.py --version "$VERSION"
      - name: Publish
        run: |-
          NPM_TAG=${{ steps.prepare.outputs.npm_tag }}
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/lynxtron
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/lynxtron-dev-plugins
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/create-lynxtron
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/lynxtron-builder
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/lynxtron-rebuild
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/lynx-library-headers
          npm publish --access public --provenance --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/lynxtron/src/packages/cef-webview
          npm publish --access public --provenance --tag "$NPM_TAG"
